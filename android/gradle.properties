org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# SDL3's Java side (org.libsdl.app.*) is not vendored here: it is compiled straight out of the SDL3
# checkout that the native CMake build already downloaded, so the two halves can never drift apart.
# tools/build-wario-android.ps1 passes the real path; this default matches its build directory.
wario.sdl3JavaDir=../build-android/_deps/sdl-src/android-project/app/src/main/java
